name: lwk-futures-trading-bot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trading_bot
      POSTGRES_PASSWORD: trading_bot
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_bot -d trading_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    command: ["python", "main.py", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: local
      API_TOKEN: ""
      API_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173"]'
      DATABASE_URL: postgresql+psycopg://trading_bot:trading_bot@postgres:5432/trading_bot
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_SOURCE: rest
      USE_TESTNET: "true"
      CONFIRM_LIVE_TRADING: "false"
      METRICS_ENABLED: "true"
      METRICS_INCLUDE_DATABASE: "true"
      METRICS_TOKEN: ""
      READINESS_CHECK_DATABASE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  market-data:
    profiles: ["market-data"]
    build:
      context: .
    command: ["python", "main.py", "market-data"]
    environment:
      APP_ENV: local
      REDIS_URL: redis://redis:6379/0
      SYMBOLS: ZECUSDT
      TIMEFRAME: 5m
      USE_TESTNET: "true"
      MARKET_DATA_CHANNEL: market_data.kline
      MARKET_DATA_HISTORY_SIZE: "500"
      MARKET_DATA_RECONNECT_BACKOFF_SECONDS: "2"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
