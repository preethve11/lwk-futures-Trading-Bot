name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Lint, type check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy app --strict --ignore-missing-imports

      - name: Pytest
        run: pytest tests/

      - name: Market data CLI smoke
        run: python main.py market-data --max-messages 0

      - name: Monte Carlo CLI smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("pytest_tmp").mkdir(exist_ok=True)
          Path("pytest_tmp/monte_carlo_input.json").write_text(json.dumps({"pnls": [10.0, -5.0, 7.5]}), encoding="utf-8")
          PY
          python main.py monte-carlo --returns-json pytest_tmp/monte_carlo_input.json --report-json pytest_tmp/monte_carlo_report.json --simulations 10 --horizon-trades 5

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend test
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Docker build backend
        run: docker build -t lwk-futures-trading-bot:ci .

      - name: Docker build frontend
        run: docker build -t lwk-futures-dashboard:ci ./frontend

      - name: Compose config
        run: docker compose config

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
