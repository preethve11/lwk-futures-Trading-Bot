# Trading Bot — config.yaml
# Override with environment variables (e.g. BINANCE_API_KEY, SYMBOL).

api:
  use_testnet: true

strategy:
  name: ema_rsi_vwap
  symbol: ZECUSDT
  symbols: [ZECUSDT]
  timeframe: 5m
  ema_fast: 9
  ema_slow: 21
  rsi_len: 7
  atr_len: 14
  atr_stop_mult: 0.8
  atr_tp_mult: 1.6
  vol_mult: 1.5
  vol_ma_len: 20
  vwap_window: 0  # 0 = cumulative VWAP; >0 = rolling VWAP window
  rsi_long_min: 48
  rsi_short_max: 52
  cooldown_candles: 1

risk:
  risk_per_trade_usd: 10.0
  max_daily_loss_usd: 50.0
  max_drawdown_pct: 20.0
  min_notional: 5.0
  max_position_pct_capital: 100.0
  use_atr_position_cap: true
  trailing_stop_atr_mult: 0   # 0 = disabled
  min_risk_reward: 1.0

execution:
  leverage: 5
  slippage_bps: 5.0
  fee_bps: 4.0

telegram:
  # bot_token and chat_id from .env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
  bot_token: ""
  chat_id: ""

logging:
  level: INFO
  log_dir: logs
  log_file: trading_bot.log

backtest:
  start_date: null
  end_date: null
  initial_capital: 10000.0
  historical_data_csv: null
  historical_data_dir: null
  report_dir: reports/backtests

persistence:
  # Local/dev convenience. Production should run Alembic and set this false.
  auto_create_tables: true

optimization:
  walk_forward:
    train_size: 500
    validation_size: 100
    step_size: 100
    trials: 30
    objective: sharpe
    random_seed: 42
    report_dir: reports/optimizations
  monte_carlo:
    simulations: 1000
    horizon_trades: 100
    ruin_drawdown_pct: 30.0
    random_seed: 42
    report_dir: reports/monte_carlo

market_data:
  # rest = live strategy loop polls Binance REST.
  # redis = live strategy loop consumes klines published by `python main.py market-data`.
  source: rest
  channel: market_data.kline
  history_size: 500
  reconnect_backoff_seconds: 2.0

ai_journal:
  enabled: false
  model: gpt-4.1-mini
  timeout_seconds: 15.0
  max_queue_size: 1000

monitoring:
  metrics_enabled: true
  metrics_include_database: true
  metrics_token: ""
  readiness_check_database: true
  account_reconciliation_interval_seconds: 300
  account_equity_drift_threshold_usd: 25.0
  account_equity_drift_threshold_pct: 5.0
  live_strategy_gate_enabled: false
  live_strategy_gate_required_for_mainnet: true
  live_gate_min_trades: 20
  live_gate_min_profit_factor: 1.1
  live_gate_min_expectancy_usd: 0.0
  live_gate_min_sharpe: 0.0
  live_gate_max_drawdown_pct: 20.0
  live_gate_max_backtest_age_days: 30
