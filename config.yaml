# Trading Bot — config.yaml
# Override with environment variables (e.g. BINANCE_API_KEY, SYMBOL).

api:
  use_testnet: true
  enable_live_trading: false

strategy:
  name: session_breakout
  symbol: ZECUSDT
  symbols: [ZECUSDT]
  timeframe: 1h
  ema_fast: 9
  ema_slow: 21
  rsi_len: 7
  atr_len: 14
  atr_stop_mult: 0.8
  atr_tp_mult: 1.6
  vol_mult: 1.5
  vol_ma_len: 20
  vwap_window: 0  # 0 = cumulative VWAP; >0 = rolling VWAP window
  rsi_long_min: 48
  rsi_short_max: 52
  cooldown_candles: 1
  # Session-open breakout diagnostics strategy. 5m is deliberately disabled until it proves edge out of sample.
  session_breakout_sessions: ["nse:03:45", "london:08:00", "new_york:14:30"]
  session_breakout_pre_open_minutes: 120
  session_breakout_trade_window_minutes: 240
  session_breakout_min_range_width_pct: 0.4
  session_breakout_ema_length: 50
  session_breakout_adx_length: 14
  session_breakout_min_adx: 20.0
  session_breakout_entry_buffer_pct: 0.0
  session_breakout_enabled_timeframes: ["15m", "1h"]
  adaptive_momentum_breakout:
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, LINKUSDT]
    research_only_symbols: [ZECUSDT]
    enabled_timeframes: ["15m", "1h"]
    donchian_window: 20
    ema_fast: 50
    ema_slow: 200
    adx_length: 14
    long_adx_min: 22.0
    short_adx_min: 25.0
    volume_ratio_min: 1.1
    atr_length: 14
    stop_atr_mult: 2.5
    take_profit_r_multiple: 2.0
    trailing_stop_atr_mult: 3.0
    max_holding_bars: 120
    spread_max_bps: 8.0
    funding_rate_abs_long_max: 0.0003
    funding_rate_abs_short_max: 0.0003
    funding_rate_delta_max: 0.0001
    open_interest_spike_pct_max: 12.0
    adl_quantile_max: 3.0
    liquidation_spike_ratio_max: 3.0
    volatility_shock_percentile_min: 0.9
    allowed_days_of_week: [0, 1, 2, 3, 4, 5, 6]
    blocked_hours_utc: []
    max_expected_cost_share: 0.35
    short_position_size_multiplier: 0.5

risk:
  risk_per_trade_usd: 10.0
  max_daily_loss_usd: 50.0
  max_drawdown_pct: 20.0
  min_notional: 5.0
  max_position_pct_capital: 100.0
  use_atr_position_cap: true
  trailing_stop_atr_mult: 0   # 0 = disabled
  min_risk_reward: 1.0

execution:
  leverage: 5
  slippage_bps: 5.0
  fee_bps: 4.0

telegram:
  # bot_token and chat_id from .env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
  bot_token: ""
  chat_id: ""

logging:
  level: INFO
  log_dir: logs
  log_file: trading_bot.log

backtest:
  start_date: null
  end_date: null
  initial_capital: 10000.0
  historical_data_csv: null
  historical_data_dir: null
  report_dir: reports/backtests

persistence:
  # Local/dev convenience. Production should run Alembic and set this false.
  auto_create_tables: true

optimization:
  walk_forward:
    train_size: 500
    validation_size: 100
    step_size: 100
    embargo_size: 480
    trials: 30
    objective: sharpe
    random_seed: 42
    report_dir: reports/optimizations
  monte_carlo:
    simulations: 1000
    horizon_trades: 100
    ruin_drawdown_pct: 30.0
    random_seed: 42
    report_dir: reports/monte_carlo

market_data:
  # rest = live strategy loop polls Binance REST.
  # redis = live strategy loop consumes klines published by `python main.py market-data`.
  source: rest
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  timeframes: [5m, 15m, 1h]
  channel: market_data.kline
  history_size: 500
  reconnect_backoff_seconds: 2.0

ai_journal:
  enabled: false
  model: gpt-4.1-mini
  timeout_seconds: 15.0
  max_queue_size: 1000

monitoring:
  metrics_enabled: true
  metrics_include_database: true
  metrics_token: ""
  readiness_check_database: true
  account_reconciliation_interval_seconds: 300
  account_equity_drift_threshold_usd: 25.0
  account_equity_drift_threshold_pct: 5.0
  live_strategy_gate_enabled: false
  live_strategy_gate_required_for_mainnet: true
  live_gate_min_trades: 100
  live_gate_min_profit_factor: 1.25
  live_gate_min_expectancy_usd: 0.0
  live_gate_min_sharpe: 0.0
  live_gate_max_drawdown_pct: 15.0
  live_gate_max_backtest_age_days: 30
